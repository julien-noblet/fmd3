{{- if and (not .Values.worker.existingSecret) (or .Values.worker.enabled .Values.worker.internalToken) }}
{{- $secretName := printf "%s-worker" (include "fmd3.fullname" .) }}
{{- $secretKey := .Values.worker.secretKey | default "internal-token" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $token := .Values.worker.internalToken }}
{{- if and (not $token) $existing $existing.data (hasKey $existing.data $secretKey) }}
{{- $token = index $existing.data $secretKey | b64dec }}
{{- end }}
{{- if not $token }}
{{- $token = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "fmd3.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
type: Opaque
stringData:
  {{ $secretKey }}: {{ $token | quote }}
{{- end }}
