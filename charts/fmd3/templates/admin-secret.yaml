{{- if and (not .Values.admin.existingSecret) .Values.admin.username .Values.admin.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fmd3.fullname" . }}-admin
  labels:
    {{- include "fmd3.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.admin.userSecretKey | default "admin-user" }}: {{ .Values.admin.username | quote }}
  {{ .Values.admin.passwordSecretKey | default "admin-password" }}: {{ .Values.admin.password | quote }}
{{- end }}
